# Adresse réelle du visiteur. Derrière le tunnel, cloudflared se connecte depuis la machine :
# $remote_addr serait le même pour tout le monde. Cloudflare transmet l'adresse du visiteur dans
# CF-Connecting-IP et écrase toute valeur envoyée par le client. En accès local, l'adresse TCP fait foi.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Protocole du visiteur côté Cloudflare. Vide en accès local : surtout pas $scheme, qui vaut toujours
# « http » ici et redirigerait l'accès local vers HTTPS (piège déjà rencontré sur ManGuessr).
map $http_cf_visitor $visitor_scheme {
    ~*"scheme":"https"  https;
    ~*"scheme":"http"   http;
    default             "";
}

map $visitor_scheme $forwarded_proto {
    ""      $scheme;
    default $visitor_scheme;
}

map $visitor_scheme $hsts {
    https   "max-age=31536000";
    default "";
}

# Limites de débit par visiteur (429 au-delà).
limit_req_zone $client_ip zone=contact:10m rate=5r/m;
limit_req_zone $client_ip zone=admin:10m rate=30r/m;
# Mesures du Pi sur l'accueil : la page les relit chaque minute, la marge est large.
limit_req_zone $client_ip zone=status:10m rate=20r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    limit_req_status 429;
    client_max_body_size 16k;

    # DNS interne de Docker, interrogé à chaque requête : nginx démarre et sert le site même si l'API
    # est arrêtée. Seul le formulaire de contact est alors indisponible.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://api:8080;

    if ($visitor_scheme = "http") {
        return 301 https://$host$request_uri;
    }

    # Une seule adresse publique : www renvoie vers le domaine nu.
    if ($host = "www.julienhome.com") {
        return 301 https://julienhome.com$request_uri;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # Fichiers de build : leur nom porte une empreinte du contenu, ils sont immuables.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Pages pré-générées : /projets/tima sert /projets/tima/index.html. Jamais mises en cache, sinon un
    # navigateur garderait la référence aux assets d'un ancien build.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /api/contact {
        limit_except POST { deny all; }
        limit_req zone=contact burst=3 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /api/status {
        limit_except GET { deny all; }
        limit_req zone=status burst=10 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /api/admin/ {
        limit_req zone=admin burst=10 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Le reste de /api n'existe pas : inutile de le transmettre à Spring.
    location /api/ {
        return 404;
    }
}
