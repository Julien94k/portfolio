# Inclus dans chaque location : un add_header dans une location annule l'héritage de ceux du bloc server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Vide en accès local (HTTP) : nginx n'émet pas un en-tête de valeur vide.
add_header Strict-Transport-Security $hsts always;
# Tout vient de ce domaine, polices comprises : aucun script ni style en ligne, aucune ressource tierce.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
